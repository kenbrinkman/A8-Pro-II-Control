automation:
  - id: a8_light3_slider_push
    alias: "A8 Light 3 - push slider to light"
    mode: queued
    triggers:
      - trigger: state
        entity_id: [input_number.a8_light3_w,input_number.a8_light3_b,input_number.a8_light3_r,input_number.a8_light3_g,input_number.a8_light3_b2,input_number.a8_light3_p,input_number.a8_light3_uv,input_number.a8_light3_wm]
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    actions:
      - action: rest_command.a8_set_channel
        data:
          ip: "192.168.1.208"
          channel: "{{ trigger.entity_id.split('_')[-1] }}"
          pct: "{{ trigger.to_state.state }}"
